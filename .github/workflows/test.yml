name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tgi
          POSTGRES_PASSWORD: tgi
          POSTGRES_DB: tgi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tgi -d tgi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://tgi:tgi@localhost:5432/tgi_test
